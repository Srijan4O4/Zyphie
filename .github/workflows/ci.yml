name: Foundation
on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**', 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            preset: debug
          - os: windows-2022
            preset: release
          - os: ubuntu-24.04
            preset: sanitize
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: microsoft/vcpkg
          ref: 9eec002df1cd109f8f104cd966a763daf9751489
          path: .tools/vcpkg
      - name: Bootstrap dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ./.tools/vcpkg/bootstrap-vcpkg.bat -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "VCPKG_ROOT=$((Resolve-Path ./.tools/vcpkg).Path)" >> $env:GITHUB_ENV
          "VCPKG_DISABLE_METRICS=1" >> $env:GITHUB_ENV
      - name: Bootstrap dependencies (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          ./.tools/vcpkg/bootstrap-vcpkg.sh -disableMetrics
          echo "VCPKG_ROOT=$GITHUB_WORKSPACE/.tools/vcpkg" >> "$GITHUB_ENV"
          echo "VCPKG_DISABLE_METRICS=1" >> "$GITHUB_ENV"
      - name: Install pinned Qt Widgets SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install aqtinstall==3.3.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m aqt install-qt windows desktop 6.8.3 win64_msvc2022_64 -O .tools/Qt --archives qtbase
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$((Resolve-Path .tools/Qt/6.8.3/msvc2022_64/bin).Path)" >> $env:GITHUB_PATH
      - name: Configure, build and test (Windows x64)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b %errorlevel%
          cmake --preset ${{ matrix.preset }} -DZYPH_BUILD_DESKTOP=ON -DCMAKE_PREFIX_PATH="%CD%/.tools/Qt/6.8.3/msvc2022_64"
          if errorlevel 1 exit /b %errorlevel%
          cmake --build --preset ${{ matrix.preset }}
          if errorlevel 1 exit /b %errorlevel%
          ctest --preset ${{ matrix.preset }}
          if errorlevel 1 exit /b %errorlevel%
          ctest --preset ${{ matrix.preset }} -R desktop_workflows --repeat until-fail:10
          if errorlevel 1 exit /b %errorlevel%
          python tests/integration/cancel.py build/${{ matrix.preset }}/zyph.exe build/cancel
          if errorlevel 1 exit /b %errorlevel%
      - name: Configure, build and test (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cmake --preset ${{ matrix.preset }}
          cmake --build --preset ${{ matrix.preset }}
          ctest --preset ${{ matrix.preset }}
          python3 tests/integration/cancel.py build/${{ matrix.preset }}/zyph build/cancel
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: microsoft/vcpkg
          ref: 9eec002df1cd109f8f104cd966a763daf9751489
          path: .tools/vcpkg
      - name: Build instrumented fuzz targets
        shell: bash
        run: |
          ./.tools/vcpkg/bootstrap-vcpkg.sh -disableMetrics
          export VCPKG_ROOT="$GITHUB_WORKSPACE/.tools/vcpkg" VCPKG_DISABLE_METRICS=1
          cmake -S . -B build/fuzz -G Ninja -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Debug -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DBUILD_TESTING=OFF -DZYPH_ENABLE_SANITIZERS=ON -DZYPH_BUILD_FUZZERS=ON
          cmake --build build/fuzz --parallel 2
      - name: Bounded archive and path campaigns
        shell: bash
        run: |
          mkdir -p build/corpus-archive build/corpus-path build/fuzz-artifacts
          cp tests/fixtures/*.zyph build/corpus-archive/
          printf '../escape' > build/corpus-path/traversal
          printf 'folder/file.txt' > build/corpus-path/valid
          printf 'COM1.txt' > build/corpus-path/device
          build/fuzz/zyph_fuzz_archive build/corpus-archive -runs=20000 -seed=20261022 -max_len=65536 -timeout=10 -rss_limit_mb=1024 -artifact_prefix=build/fuzz-artifacts/
          build/fuzz/zyph_fuzz_path build/corpus-path -runs=100000 -seed=20261022 -max_len=8192 -timeout=5 -rss_limit_mb=512 -artifact_prefix=build/fuzz-artifacts/
